services:
  telestream:
    image: ghcr.io/yazdipour/telestreamm3ubot:${TELESTREAM_IMAGE_TAG:-latest}
    env_file: .env
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - telestream-data:/data

volumes:
  telestream-data: